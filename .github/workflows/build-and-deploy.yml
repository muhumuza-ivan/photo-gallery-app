name: Build and deploy

# Push to main -> build image -> push :sha -> publish deploy bundle -> push
# :latest. The final :latest push is what EventBridge listens for, so the
# taskdef and appspec are always in S3 before the pipeline starts.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Only the OIDC token is needed. No AWS access keys exist in this repository.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
  ECR_REPOSITORY: photo-gallery
  ARTIFACT_KEY: deploy/photo-gallery-deploy.zip
  # The infrastructure stack whose outputs fill taskdef.json's placeholders.
  INFRA_STACK: photo-gallery

jobs:
  build-and-deploy:
    name: Build image and trigger deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out application code
        uses: actions/checkout@v4

      # ---- OIDC: exchange the GitHub token for short-lived AWS credentials ----
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image and push the immutable tag
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$SHA"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          echo "IMAGE_URI=$IMAGE" >> "$GITHUB_ENV"

      # ---- Fill the committed taskdef.json ------------------------------------
      # taskdef.json lives in this repository and holds the structure: container
      # name, ports, env var names, log config, cpu and memory. What it does NOT
      # hold is anything account-specific - no account id, no ARNs, no RDS
      # endpoint - so nothing about the environment is stored in git.
      #
      # Those seven __TOKENS__ are filled from the infrastructure stack's own
      # outputs at deploy time, which is what lets the environment be rebuilt
      # without editing this repository. Four of them (DB_HOST, the secret ARN,
      # the bucket, the CloudFront domain) are generated by AWS and change on
      # every rebuild.
      - name: Fill taskdef.json from the stack outputs
        run: |
          set -euo pipefail
          out() { aws cloudformation describe-stacks --stack-name "$INFRA_STACK" \
                    --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
                    --output text; }

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          DB_HOST=$(out DatabaseEndpoint)
          DB_SECRET=$(out DatabaseSecretArn)
          S3_BUCKET=$(out ImageBucketName)
          CDN=$(out CloudFrontDomainName)

          # An absent output reads back as "None", which would substitute
          # cleanly and fail much later inside the running container.
          for v in ACCOUNT DB_HOST DB_SECRET S3_BUCKET CDN; do
            if [[ -z "${!v}" || "${!v}" == "None" ]]; then
              echo "::error::$v is empty - is the '$INFRA_STACK' stack deployed?"
              exit 1
            fi
          done

          sed -e "s|__IMAGE__|${IMAGE_URI}|g" \
              -e "s|__ACCOUNT__|${ACCOUNT}|g" \
              -e "s|__REGION__|${AWS_REGION}|g" \
              -e "s|__DB_HOST__|${DB_HOST}|g" \
              -e "s|__DB_SECRET_ARN__|${DB_SECRET}|g" \
              -e "s|__S3_BUCKET__|${S3_BUCKET}|g" \
              -e "s|__CLOUDFRONT_DOMAIN__|${CDN}|g" \
              taskdef.json > taskdef.filled.json
          mv taskdef.filled.json taskdef.json

          # A typo'd token would otherwise reach ECS verbatim. The character
          # class needs 0-9: __S3_BUCKET__ has a digit in it.
          if grep -qE '__[A-Z0-9_]+__' taskdef.json; then
            echo "::error::unsubstituted placeholders remain:"
            grep -oE '__[A-Z0-9_]+__' taskdef.json | sort -u
            exit 1
          fi

          echo "Deploying image: ${IMAGE_URI}"

      - name: Publish deploy bundle to S3
        run: |
          set -euo pipefail
          zip -q -j deploy-bundle.zip taskdef.json appspec.yaml
          aws s3 cp deploy-bundle.zip "s3://${ARTIFACT_BUCKET}/${ARTIFACT_KEY}"
          echo "Published s3://${ARTIFACT_BUCKET}/${ARTIFACT_KEY}"

      # ---- The trigger. Pushed last, on purpose. ------------------------------
      - name: Push :latest to start the blue/green deployment
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Summary
        run: |
          {
            echo "### Deployment triggered"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE_URI\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Trigger | ECR push of \`:latest\` -> EventBridge -> CodePipeline |"
          } >> "$GITHUB_STEP_SUMMARY"
